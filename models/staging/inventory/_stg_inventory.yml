models: 
  - name: stg_inventory__inventory_snapshots
    description: grain is one row per stock lot per snapshot date.
    columns: 
      - name: snapshot_date
        data_type: date
        description: date of the daily snapshot
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: outlet_id
        data_type: varchar
        description: Anonymised outlet ID (hashed text). Joins to `branches.csv`
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: lot_id
        data_type: varchar
        description: Stock lot - one delivery of one product to one outlet. Appears every day until sold out or removed.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_id
        data_type: varchar
        description: product ID.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_name
        data_type: varchar
        description: Product name as shown on the shelf label
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: family_code
        data_type: varchar
        description: Product family code. Joins to `product_families.csv`
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: storage_zone
        data_type: varchar
        description: values `A` = ambient shelf, `C` = cold chain (fridge), `Q` = quarantine (damaged or recalled, not on sale)
        data_tests:
        - not_null:
            config:
              severity: warn
        - accepted_values:
            arguments:
              values: ['A', 'C', 'Q']
            config:
              severity: error
      - name: date_type
        data_type: varchar
        description: values `EXP` = hard expiry date (must not be sold after it), `BBE` = best before (quality may decline after it)
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['EXP', 'BBE']
              config:
                severity: error
      - name: expiry_date
        data_type: date
        description: The date printed on the product (ISO text)
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: price_before_discount
        data_type: number
        description: Normal shelf price in EUR, before discount
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: discount_rate
        data_type: number
        description: Near-expiry discount as a fraction (`0.30` = 30% off)
      - name: price_sale
        data_type: number
        description: Price the customer pays, after discount
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pack_size
        data_type: integer
        description: Quantity in the pack, in `pack_unit`
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pack_unit
        data_type: varchar
        description: values `g`, `ml` or `unit` (pieces, tablets, sachets). NULLs in the raw export filled with unit (all had price_per_100 = 0).
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              arguments:
                values: ['g', 'ml', 'unit']
              config:
                severity: error
      - name: price_per_100
        data_type: number
        description: Price per 100 g or 100 ml, shown on the label. `0` for products sold by unit
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: units_received
        data_type: integer
        description: Units received in the lot's delivery
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: units_on_sale
        data_type: integer
        description: Units put on sale (received minus anything not sellable)
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: units_sold
        data_type: integer
        description: Units sold **since the lot went on sale** (cumulative)
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: units_remaining
        data_type: integer
        description: Units still on sale at the snapshot
        data_tests:
          - not_null:
              config:
                severity: warn
